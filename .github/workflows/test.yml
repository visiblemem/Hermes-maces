name: MACES Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: maces-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests __init__.py
      - name: Compile
        run: python -m compileall -q src __init__.py
      - name: Unit and security tests
        run: pytest -q -m "not e2e"
      - name: Public repository boundary
        run: python scripts/check_public_boundary.py
      - name: Build package metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  hermes-plugin-manager-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        hermes: ["0.18.2", "0.21.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - if: matrix.hermes == '0.18.2'
        run: python -m pip install 'hermes-agent==0.18.2'
      - name: Check out pinned Hermes 0.21.1 source
        if: matrix.hermes == '0.21.1'
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2237be355906fbe6065ce1815711eee52b2d646e
          path: hermes-host
      - if: matrix.hermes == '0.21.1'
        run: python -m pip install ./hermes-host
      - name: Real Hermes PluginManager E2E
        run: pytest -q -m e2e
